<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Sin conexión</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: Canvas;
        color: CanvasText;
      }
      main {
        max-width: 360px;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        opacity: 0.75;
        line-height: 1.5;
      }
      button {
        font: inherit;
        padding: 10px 20px;
        border-radius: 10px;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>
        Revisa tu internet y vuelve a intentar. Tus reservas y pagos solo se
        hacen con conexión.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
