    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://agendauno.mx/#organization",
            "name": "AgendaUno",
            "url": "https://agendauno.mx/",
            "logo": "https://agendauno.mx/assets/brand/turnouno-logo.webp"
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://agendauno.mx/#software",
            "name": "AgendaUno",
            "url": "https://agendauno.mx/",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "inLanguage": "es-MX",
            "description": "Software de gestión para estudios y academias con agenda, reservas, membresías, cobros y asistencia.",
            "publisher": { "@id": "https://agendauno.mx/#organization" }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "¿Necesito tarjeta para la prueba?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. La prueba dura 14 días y no requiere tarjeta."
                }
              },
              {
                "@type": "Question",
                "name": "¿Cómo se calcula el precio de AgendaUno?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "La renta mensual se calcula por los alumnos activos del estudio; administradores e instructores no se cuentan como alumnos."
                }
              },
              {
                "@type": "Question",
                "name": "¿Los datos se comparten entre estudios?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Cada estudio opera como un tenant independiente con sus propios usuarios, membresías, precios, paquetes, pagos y datos."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>
