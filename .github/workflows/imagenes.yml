name: Imágenes

# Publica en GitHub Container Registry las imágenes de producción de cada componente
# (ADR 0113): api, web, landing-agendauno y landing-turnouno, con la etiqueta del
# commit (la misma VERSION que usa actualizar.sh). Las etiquetas son inmutables: si
# una ya existe no se vuelve a publicar. El servidor las usa si tiene REGISTRO en
# web.env; si no, sigue construyendo las suyas. Nada de aquí despliega.
#
# web y las landings llevan dentro sus variables públicas (dominios, reCAPTCHA…): se
# toman de las variables del repositorio (Settings → Secrets and variables → Actions →
# Variables; docs/CI-CD.md). Sin DOMINIO ni VITE_RECAPTCHA_SITE_KEY no se publican
# (una web de producción sin captcha no deja registrar negocios).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: imagenes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    name: GHCR · ${{ matrix.componente }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - componente: api
            dockerfile: infra/produccion/api.Dockerfile
            producto: ''
          - componente: web
            dockerfile: infra/produccion/web.Dockerfile
            producto: ''
          - componente: landing-agendauno
            dockerfile: infra/produccion/landing.Dockerfile
            producto: agendauno
          - componente: landing-turnouno
            dockerfile: infra/produccion/landing.Dockerfile
            producto: turnouno
    env:
      COMPONENTE: ${{ matrix.componente }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      PRODUCTO: ${{ matrix.producto }}
      DOMINIO: ${{ vars.DOMINIO }}
      DOMINIO_TURNOUNO: ${{ vars.DOMINIO_TURNOUNO }}
      VITE_TURNOUNO_NOMBRE: ${{ vars.VITE_TURNOUNO_NOMBRE }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
      VITE_ANALYTICS_ENDPOINT: ${{ vars.VITE_ANALYTICS_ENDPOINT }}
      VITE_VENTAS_WHATSAPP: ${{ vars.VITE_VENTAS_WHATSAPP }}
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
    steps:
      - uses: actions/checkout@v5

      - name: Versión y nombre
        id: imagen
        run: |
          set -euo pipefail
          dueno="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "nombre=ghcr.io/$dueno/agendauno-$COMPONENTE" >> "$GITHUB_OUTPUT"
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Variables públicas de la web
        id: variables
        run: |
          if [ "$COMPONENTE" != "api" ] && { [ -z "$DOMINIO" ] || [ -z "$VITE_RECAPTCHA_SITE_KEY" ]; }; then
            echo "::warning::$COMPONENTE no se publica: faltan las variables DOMINIO o VITE_RECAPTCHA_SITE_KEY del repositorio (docs/CI-CD.md)."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Entrar a GHCR
        if: steps.variables.outputs.publicar == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Inmutable: una etiqueta publicada no se reemplaza (el servidor puede volver a ella).
      - name: ¿Ya existe?
        id: existe
        if: steps.variables.outputs.publicar == 'true'
        env:
          IMAGEN: ${{ steps.imagen.outputs.nombre }}
          VERSION: ${{ steps.imagen.outputs.version }}
        run: |
          if docker manifest inspect "$IMAGEN:$VERSION" >/dev/null 2>&1; then
            echo "$IMAGEN:$VERSION ya está publicada: no se reemplaza."
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Construir y publicar
        if: steps.variables.outputs.publicar == 'true' && steps.existe.outputs.existe == 'false'
        env:
          IMAGEN: ${{ steps.imagen.outputs.nombre }}
          VERSION: ${{ steps.imagen.outputs.version }}
          ETIQUETA_GIT: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          set -euo pipefail
          docker buildx create --use --driver docker-container >/dev/null
          etiquetas=(--tag "$IMAGEN:$VERSION")
          if [ -n "$ETIQUETA_GIT" ] && ! docker manifest inspect "$IMAGEN:$ETIQUETA_GIT" >/dev/null 2>&1; then
            etiquetas+=(--tag "$IMAGEN:$ETIQUETA_GIT")
          fi
          argumentos=()
          if [ "$COMPONENTE" != "api" ]; then
            argumentos=(
              --build-arg "VITE_DOMINIO_PUBLICO=$DOMINIO"
              --build-arg "VITE_DOMINIO_TURNOUNO=${DOMINIO_TURNOUNO:-turnouno.mx}"
              --build-arg "VITE_TURNOUNO_NOMBRE=$VITE_TURNOUNO_NOMBRE"
              --build-arg "VITE_GOOGLE_CLIENT_ID=$VITE_GOOGLE_CLIENT_ID"
              --build-arg "VITE_RECAPTCHA_SITE_KEY=$VITE_RECAPTCHA_SITE_KEY"
              --build-arg "VITE_ANALYTICS_ENDPOINT=$VITE_ANALYTICS_ENDPOINT"
              --build-arg "VITE_VENTAS_WHATSAPP=$VITE_VENTAS_WHATSAPP"
              --build-arg "GOOGLE_SITE_VERIFICATION=$GOOGLE_SITE_VERIFICATION"
              --build-arg "VITE_APP_VERSION=$VERSION"
            )
          fi
          if [ -n "$PRODUCTO" ]; then
            argumentos+=(--build-arg "PRODUCTO=$PRODUCTO")
          fi
          docker buildx build . \
            --file "$DOCKERFILE" \
            "${etiquetas[@]}" \
            "${argumentos[@]}" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --cache-from "type=registry,ref=$IMAGEN:cache" \
            --cache-to "type=registry,ref=$IMAGEN:cache,mode=max" \
            --push
          echo "Publicada: $IMAGEN:$VERSION" >> "$GITHUB_STEP_SUMMARY"
