name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · Laravel
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: agendauno_testing
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: 127.0.0.1
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: agendauno_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # pdo_sqlite: las BD por tenant (data plane) usan SQLite en test/CI.
          extensions: pdo_mysql, pdo_sqlite, sqlite3, bcmath, intl, mbstring, zip
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      # Toda la suite en un proceso: con más de mil pruebas, 512 MB ya no alcanzan.
      - name: Tests (Pest)
        run: php -d memory_limit=2G artisan test

      # Las pruebas usan SQLite para los negocios, que no tiene candados de fila ni
      # escrituras simultáneas: aquí se comprueba en MySQL con procesos a la vez
      # (último lugar, mismo horario, cancelar y reprogramar, migraciones de varios
      # negocios, respaldo y restauración).
      - name: Concurrency on MySQL
        env:
          DB_DATABASE: agendauno_verificacion
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE agendauno_verificacion CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          php artisan migrate --force
          php artisan agendauno:verificar-concurrencia --rondas=4

  web:
    name: Web · Vue
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Las páginas comerciales prerenderizadas (HTML sin JS, SEO, menú, CSS) y su
      # servicio por HTTP: un dist/clases/index.html vacío no llega a producción.
      - run: npm run test:marketing
      - run: npm run test

  mobile:
    name: Mobile · Flutter
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Las dos apps oficiales (ADR 0111) compilan con su sabor: cada una es otra app en
  # las tiendas (id, nombre, ícono). Sin firma de release: debug basta para probarlo.
  mobile-android:
    name: Mobile · APK ${{ matrix.sabor }}
    runs-on: ubuntu-24.04
    needs: mobile
    strategy:
      matrix:
        sabor: [agendauno, turnouno]
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - run: flutter pub get
      - run: flutter build apk --debug --flavor ${{ matrix.sabor }}

  imagenes:
    name: Docker · production images
    runs-on: ubuntu-24.04
    env:
      # Igual que docker compose build en el servidor: cada Dockerfile con su
      # <Dockerfile>.dockerignore, que solo BuildKit respeta.
      DOCKER_BUILDKIT: 1
    services:
      # Para probar los respaldos con el cliente de la imagen contra MySQL 8.4.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: origen
          MYSQL_USER: agendauno
          MYSQL_PASSWORD: secreto
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5

      # Las imágenes de infra/produccion, como las construye actualizar.sh (contexto: la
      # raíz del repo), sin publicarlas. Un archivo que el Dockerfile copia y su
      # .dockerignore deja fuera falla aquí y no al desplegar.
      - name: Build API image
        run: docker build -f infra/produccion/api.Dockerfile -t agendauno-api:ci .

      - name: Build web image
        run: docker build -f infra/produccion/web.Dockerfile -t agendauno-web:ci .

      # La landing de cada producto es su propia imagen (ADR 0112).
      - name: Build landing images
        run: |
          docker build -f infra/produccion/landing.Dockerfile --build-arg PRODUCTO=agendauno -t agendauno-landing-agendauno:ci .
          docker build -f infra/produccion/landing.Dockerfile --build-arg PRODUCTO=turnouno -t agendauno-landing-turnouno:ci .

      # Configuraciones que solo se leen al arrancar: el pool de PHP-FPM y nginx con la
      # plantilla ya sustituida (el entrypoint de la imagen la procesa antes de nginx -t).
      - name: Check PHP-FPM config
        run: docker run --rm --entrypoint php-fpm agendauno-api:ci -t

      - name: Check nginx config
        run: |
          docker run --rm -e DOMINIO=agendauno.test -e DOMINIO_TURNOUNO=turnouno.test \
            -e PROXY_CONFIABLE=172.16.0.0/12 -e CABECERA_IP_REAL=X-Forwarded-For \
            agendauno-web:ci nginx -t
          docker run --rm agendauno-landing-turnouno:ci nginx -t

      # El compose con y sin los archivos de Traefik y Cloudflare (ADR 0112).
      - name: Check compose files
        working-directory: infra/produccion
        run: |
          cp api.env.example api.env
          cp web.env.example web.env
          docker compose --env-file web.env config -q
          docker compose --env-file web.env -f docker-compose.yml -f docker-compose.traefik.yml config -q
          docker compose --env-file web.env -f docker-compose.yml -f docker-compose.traefik.yml \
            -f docker-compose.cloudflare.yml config -q
          sh -n actualizar.sh && sh -n volver.sh && sh -n versiones.sh && sh -n compose.sh

      # nginx de `web` pasa la portada, las páginas por giro, el robots y los recursos de
      # cada dominio a su landing; lo demás es la aplicación, también si la landing cae.
      - name: Check web and landings routing
        run: |
          set -euo pipefail
          docker network create red-ci
          docker run -d --name landing-agendauno --network red-ci agendauno-landing-agendauno:ci
          docker run -d --name landing-turnouno --network red-ci agendauno-landing-turnouno:ci
          docker run -d --name web --network red-ci -p 127.0.0.1:8080:80 \
            -e DOMINIO=agendauno.test -e DOMINIO_TURNOUNO=turnouno.test \
            -e PROXY_CONFIABLE=172.16.0.0/12 -e CABECERA_IP_REAL=X-Forwarded-For agendauno-web:ci
          pedir() { curl -sS -o /tmp/cuerpo -w '%{http_code}' -H "Host: $1" "http://127.0.0.1:8080$2"; }
          for i in $(seq 1 30); do curl -fsS -o /dev/null -H 'Host: agendauno.test' http://127.0.0.1:8080/robots.txt && break; sleep 1; done
          test "$(pedir agendauno.test /)" = 200 && grep -q 'assets-agendauno' /tmp/cuerpo
          test "$(pedir turnouno.test /)" = 200 && grep -q 'assets-turnouno' /tmp/cuerpo
          test "$(pedir agendauno.test /robots.txt)" = 200 && grep -qi 'sitemap' /tmp/cuerpo
          test "$(pedir agendauno.test /software-para-pilates)" = 200 && grep -q 'assets-agendauno' /tmp/cuerpo
          test "$(pedir agendauno.test /assets-agendauno/no-existe.js)" = 404
          # Una página que la landing no tiene, y lo que no es de la landing: la aplicación.
          test "$(pedir agendauno.test /software-para-no-existe)" = 200 && ! grep -q 'assets-agendauno' /tmp/cuerpo
          test "$(pedir agendauno.test /entrar)" = 200 && ! grep -q 'assets-agendauno' /tmp/cuerpo
          test "$(pedir fluo.agendauno.test /)" = 200 && ! grep -q 'assets-agendauno' /tmp/cuerpo
          # Sin la landing, la portada es la aplicación (no un 502).
          docker stop landing-turnouno
          test "$(pedir turnouno.test /)" = 200
          docker rm -f web landing-agendauno landing-turnouno

      # Los respaldos usan el cliente de la imagen (MariaDB) contra MySQL 8.4: su usuario
      # normal entra con caching_sha2_password y TLS de certificado autofirmado (como
      # RESPALDOS_MYSQL_SSL_VERIFICAR=false). Vuelca y carga con las mismas opciones que
      # VolcadoBaseDatos y comprueba que el dato llegó.
      - name: Check backup client against MySQL 8.4
        run: |
          set -euo pipefail
          cliente() {
            docker run --rm -i --network host -e MYSQL_PWD="$1" -v "$PWD/volcado:/volcado" \
              --entrypoint "$2" agendauno-api:ci --skip-ssl-verify-server-cert \
              --host=127.0.0.1 --port=3306 "${@:3}"
          }
          mkdir -p volcado && chmod 777 volcado
          cliente root mysql --user=root -e "CREATE DATABASE destino; GRANT ALL ON destino.* TO 'agendauno'@'%'; CREATE TABLE origen.prueba (id INT PRIMARY KEY, nombre VARCHAR(20)); INSERT INTO origen.prueba VALUES (1, 'ñandú');"
          cliente secreto mysqldump --single-transaction --quick --skip-lock-tables --routines \
            --user=agendauno --result-file=/volcado/origen.sql origen
          cliente secreto mysql --user=agendauno destino < volcado/origen.sql
          test "$(cliente secreto mysql --user=agendauno -N -e 'SELECT nombre FROM destino.prueba WHERE id = 1')" = "ñandú"
