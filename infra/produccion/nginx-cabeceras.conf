# Cabeceras de seguridad de todas las respuestas de AgendaUno.
#
# Se incluye a nivel server (desde nginx-comun.conf) y OTRA VEZ en cada location que
# tenga su propio add_header (/assets/, el HTML): nginx solo hereda los add_header del
# nivel de arriba cuando el location no define ninguno.

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Nadie mete AgendaUno en un iframe (clickjacking), ni otros sitios ni el propio: la
# web no se inserta en ninguna parte. De la CSP solo va frame-ancestors.
add_header X-Frame-Options DENY always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;

# Solo HTTPS, también en los subdominios de los negocios (certificado comodín). Los
# navegadores la toman solo por HTTPS, es decir, a través del proxy que termina TLS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
