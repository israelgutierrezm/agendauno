# Cabeceras de seguridad de todas las respuestas de AgendaUno.
#
# Se incluye a nivel server (desde nginx-comun.conf) y OTRA VEZ en cada location que
# tenga su propio add_header (/assets/, el HTML): nginx solo hereda los add_header del
# nivel de arriba cuando el location no define ninguno.

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Nadie mete la plataforma en un iframe (clickjacking): ni otros sitios ni el propio.
# Las excepciones: la vista previa del sitio de un negocio, que su panel muestra en un
# iframe del mismo origen (ADR 0114), y sus formularios de captación (/f/…) y widgets
# (/w/…), que se embeben en su propio sitio (ADR 0117 y 0141). $marco, $marco_csp y
# $csp_base (el resto de la CSP, ADR 0174) salen de los map de nginx.conf.template.
add_header X-Frame-Options $marco always;
add_header Content-Security-Policy "$csp_base; $marco_csp" always;

# Solo HTTPS, también en los subdominios de los negocios (certificado comodín). Los
# navegadores la toman solo por HTTPS, es decir, a través del proxy que termina TLS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
