# Lo que sirve el subdominio de cada negocio y su dominio propio (ADR 0189): siempre la
# aplicación, con la cabecera y el contenido de su página pública. Lo incluyen los dos
# servidores por omisión de nginx.conf.template (puertos 80 y 81).
root /usr/share/nginx/html/app;
include /etc/nginx/snippets/agendauno-comun.conf;

# El HTML se revalida siempre (ver nginx.conf.template). La página pública del negocio llega con
# SU cabecera (título, descripción, imagen para compartir, canonical; ADR 0128):
# app.html la pide con SSI a /_cabeza-negocio. Si no es una página pública o la API
# no responde, queda la genérica sin indexar que trae app.html.
#
# Lo que no existe responde 404 de verdad, con la misma aplicación (ADR 0155): la
# API dice si la dirección es de un negocio y de una página que existe (un
# subdominio sin negocio, la página de uno sin publicar o una página propia que no
# existe, no). Si la API no responde, se sirve como siempre.
location / {
    auth_request /_existe-pagina;
    error_page 403 =404 @no_existe;
    ssi on;
    ssi_silent_errors on;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/agendauno-cabeceras.conf;
    try_files $app_html =404;
}
location @no_existe {
    ssi on;
    ssi_silent_errors on;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/agendauno-cabeceras.conf;
    try_files $app_html =404;
}
location = /_existe-pagina {
    internal;
    set $api_ruta /api/v1/pagina-negocio/existe;
    include /etc/nginx/snippets/agendauno-api-interna.conf;
    fastcgi_param HTTP_X_PAGINA $request_uri;
    fastcgi_intercept_errors on;
    error_page 400 404 405 429 500 502 503 504 = @existe_sin_api;
}
location @existe_sin_api {
    return 204;
}
# Solo la subpetición SSI: la API recibe en X-Pagina la dirección que pidió el
# navegador. Un error (404, 429, 5xx, API caída) es una respuesta vacía, nunca un
# cuerpo de error dentro del <head>.
location = /_cabeza-negocio {
    internal;
    set $api_ruta /api/v1/pagina-negocio/cabeza;
    include /etc/nginx/snippets/agendauno-api-interna.conf;
    fastcgi_param HTTP_X_PAGINA $request_uri;
    fastcgi_intercept_errors on;
    error_page 400 403 404 405 429 500 502 503 504 = @sin_cabeza;
}
location @sin_cabeza {
    return 204;
}
# Igual para el contenido de la página dentro de #app (ADR 0155).
location = /_cuerpo-negocio {
    internal;
    set $api_ruta /api/v1/pagina-negocio/cuerpo;
    include /etc/nginx/snippets/agendauno-api-interna.conf;
    fastcgi_param HTTP_X_PAGINA $request_uri;
    fastcgi_intercept_errors on;
    error_page 400 403 404 405 429 500 502 503 504 = @sin_cabeza;
}

# Su sitemap y su robots (los de la landing son los del dominio principal). Sin la
# API, el robots deja rastrear todo, como antes.
location = /sitemap.xml {
    set $api_ruta /api/v1/pagina-negocio/sitemap.xml;
    include /etc/nginx/snippets/agendauno-api-interna.conf;
}
location = /robots.txt {
    set $api_ruta /api/v1/pagina-negocio/robots.txt;
    include /etc/nginx/snippets/agendauno-api-interna.conf;
    fastcgi_intercept_errors on;
    error_page 404 429 500 502 503 504 = @robots;
}
location @robots {
    default_type text/plain;
    return 200 "User-agent: *\nAllow: /\n";
}
