; Pool de PHP-FPM de la API. Se copia a php-fpm.d/zz-agendauno.conf: se lee después
; del www.conf de la imagen oficial (que deja pm.max_children = 5 para TODA la
; plataforma) y sus valores ganan. listen = 9000 sigue en zz-docker.conf.
[www]

; Cuántas peticiones a la vez. Un proceso de Laravel como esta API suele ocupar
; 50-80 MB (el opcache, 192 MB, se comparte entre todos y no cuenta por proceso;
; memory_limit de 256 MB es el tope de una petición, no lo normal). 24 x 80 MB = ~2 GB:
; en el servidor recomendado (4 GB, MySQL aparte) deja lugar para redis, nginx, el
; worker y el programador. Con otra memoria, o si al medir sale distinto:
; max_children = memoria para PHP / memoria por proceso (docker stats muestra la del
; contenedor api bajo carga; divídela entre sus procesos php-fpm).
; Cada proceso puede tener abiertas dos conexiones a MySQL (la plataforma y el
; negocio): 24 procesos son hasta 48, más las del worker y el programador; el
; max_connections del MySQL contratado debe alcanzar.
pm = dynamic
pm.max_children = 24
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10

; Recicla cada proceso tras 500 peticiones: la memoria que acumule (fugas de
; extensiones o de librerías) no crece sin límite.
pm.max_requests = 500

; Tope de tiempo real por petición. max_execution_time (60 s) en Linux solo cuenta
; tiempo de CPU, no la espera a MySQL, a una pasarela o a Google; nginx deja de
; esperar a los 60 s (fastcgi_read_timeout) y responde 504. A los 65 s FPM corta el
; proceso para que no quede ocupado atendiendo a nadie.
request_terminate_timeout = 65s
