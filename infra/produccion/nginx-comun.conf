# Común a todos los hosts de AgendaUno (se incluye en cada server de nginx).

include /etc/nginx/snippets/agendauno-cabeceras.conf;

# PHP-FPM del servicio api. El nombre va en una variable para que nginx lo vuelva a
# resolver (DNS de Docker, cada 10 s) en lugar de quedarse con la IP que tenía al
# arrancar: si se recrea solo la API (p. ej. al cambiar api.env), el contenedor nuevo
# suele tener otra IP y con un upstream fijo todo /api daría 502 hasta reiniciar web.
# Sin un upstream con ese nombre, fastcgi_pass usa el resolver.
resolver 127.0.0.11 valid=10s ipv6=off;
set $agendauno_php api:9000;

# API de Laravel (PHP-FPM en el servicio api), incluida la revisión /up.
location ^~ /api/ {
    fastcgi_pass $agendauno_php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTPS $https_cliente if_not_empty;
    fastcgi_read_timeout 60s;
}
location = /up {
    fastcgi_pass $agendauno_php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTPS $https_cliente if_not_empty;
}

# Archivos públicos (logos, fotos): el volumen storage/app/public de la API.
location ^~ /storage/ {
    alias /var/www/storage-laravel/app/public/;
    expires 7d;
}

# Recursos con hash en el nombre: caché larga; si no existen, 404 (no HTML). Tiene
# add_header propio, así que repite las cabeceras de seguridad.
location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/agendauno-cabeceras.conf;
}

# Cualquier otro archivo (íconos, robots, sitemap, imágenes): tal cual o 404.
location ~* \.(?:ico|png|jpe?g|webp|avif|svg|gif|txt|xml|json|webmanifest|css|js|map|woff2?)$ {
    try_files $uri =404;
}
