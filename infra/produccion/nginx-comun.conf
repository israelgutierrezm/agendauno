# Común a todos los hosts de AgendaUno (se incluye en cada server de nginx).

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# API de Laravel (PHP-FPM en el servicio api), incluida la revisión /up.
location ^~ /api/ {
    fastcgi_pass agendauno_php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTPS $https_cliente if_not_empty;
    fastcgi_read_timeout 60s;
}
location = /up {
    fastcgi_pass agendauno_php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTPS $https_cliente if_not_empty;
}

# Archivos públicos (logos, fotos): el volumen storage/app/public de la API.
location ^~ /storage/ {
    alias /var/www/storage-laravel/app/public/;
    expires 7d;
}

# Recursos con hash en el nombre: caché larga; si no existen, 404 (no HTML).
location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
}

# Cualquier otro archivo (íconos, robots, sitemap, imágenes): tal cual o 404.
location ~* \.(?:ico|png|jpe?g|webp|avif|svg|gif|txt|xml|json|webmanifest|css|js|map|woff2?)$ {
    try_files $uri =404;
}
