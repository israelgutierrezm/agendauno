# nginx de la imagen de una landing (ADR 0112). Solo la alcanza el nginx de `web` por
# la red interna de Docker: él pone las cabeceras de seguridad y decide qué rutas son de
# la landing. Aquí, solo los archivos y su caché.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # El HTML se revalida siempre: tras publicar, nadie se queda con uno viejo.
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    location ~ ^/(software-para-[a-z0-9-]+)/?$ {
        add_header Cache-Control "no-cache" always;
        try_files /$1/index.html =404;
    }
    location = /sitemap.xml {
        add_header Cache-Control "no-cache" always;
    }
    location = /robots.txt {
        add_header Cache-Control "no-cache" always;
    }
    # Recursos con hash en el nombre: caché larga.
    location ~ ^/assets-[a-z]+/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        return 404;
    }
}
