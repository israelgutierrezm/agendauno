# Con el proxy de Cloudflare (nube naranja) delante de Traefik (ADR 0112). Se agrega
# después de docker-compose.traefik.yml en COMPOSE_FILE (web.env):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.traefik.yml:docker-compose.cloudflare.yml
#
# - Traefik solo deja entrar a las IP de Cloudflare a los dominios de la plataforma: nadie
#   puede saltarse Cloudflare llamando directo al servidor.
# - Por eso nginx puede tomar la IP real del cliente de CF-Connecting-IP (con X-Forwarded-For
#   vería la de Cloudflare y los límites por IP de la API serían por nodo de Cloudflare).
#
# Rangos publicados en https://www.cloudflare.com/ips/ (revisados el 2026-10-10). Si
# Cloudflare los cambia, actualízalos aquí: una IP nueva de Cloudflare fuera de la lista
# recibe 403.

services:
  web:
    environment:
      CABECERA_IP_REAL: CF-Connecting-IP
    labels:
      traefik.http.middlewares.agendauno-solo-cloudflare.ipallowlist.sourcerange: >-
        173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
      traefik.http.routers.agendauno-agendauno.middlewares: agendauno-solo-cloudflare
      traefik.http.routers.agendauno-turnouno.middlewares: agendauno-solo-cloudflare
