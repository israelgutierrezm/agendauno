# Pasa una ruta a la landing del producto (`$landing`: su contenedor, ADR 0112). El
# nombre va en una variable: nginx lo resuelve en cada petición (DNS de Docker,
# nginx-comun.conf), así que arranca aunque la landing no esté y la encuentra en cuanto
# se vuelve a publicar.
proxy_pass http://$landing;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_read_timeout 15s;
# La caché la decide la landing; las cabeceras de seguridad, aquí (al tener add_header
# propio, cada location las repite).
include /etc/nginx/snippets/agendauno-cabeceras.conf;
