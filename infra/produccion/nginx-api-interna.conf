# nginx le pide algo a la API con una ruta fija ($api_ruta, puesta con `set` antes de
# incluir esto): la cabecera de la página de un negocio (SSI), su sitemap y su robots
# (ADR 0128). No usa fastcgi_params: ahí REQUEST_URI es la dirección que pidió el
# navegador (también en una subpetición SSI) y Laravel enrutaría esa, no la de la API.
# Las cabeceras del navegador (Host, X-Forwarded-*) pasan tal cual: el negocio sale
# del host.
fastcgi_pass $agendauno_php;
fastcgi_pass_request_body off;
fastcgi_param GATEWAY_INTERFACE CGI/1.1;
fastcgi_param SERVER_SOFTWARE nginx;
fastcgi_param SERVER_PROTOCOL $server_protocol;
fastcgi_param REQUEST_SCHEME $scheme;
fastcgi_param HTTPS $https_cliente if_not_empty;
fastcgi_param REQUEST_METHOD GET;
fastcgi_param QUERY_STRING "";
fastcgi_param REQUEST_URI $api_ruta;
fastcgi_param DOCUMENT_URI $api_ruta;
fastcgi_param DOCUMENT_ROOT /var/www/html/public;
fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param REMOTE_ADDR $remote_addr;
fastcgi_param REMOTE_PORT $remote_port;
fastcgi_param SERVER_ADDR $server_addr;
fastcgi_param SERVER_PORT $server_port;
fastcgi_param SERVER_NAME $server_name;
# La página espera esta respuesta: si la API tarda, mejor la cabecera genérica.
fastcgi_connect_timeout 2s;
fastcgi_read_timeout 5s;
