# Minimal development infrastructure for AgendaUno.
#
# MySQL is provided by your local WAMP (port 3306); only Redis is containerized
# because it is not installed natively on Windows.
#
# Usage:
#   docker compose -f infra/docker/docker-compose.yml up -d redis
#   docker compose -f infra/docker/docker-compose.yml ps
#
services:
  redis:
    image: redis:7-alpine
    container_name: agendauno-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional dev email catcher (transactional email arrives here instead of being sent).
  # Enable when the Communications work begins.
  # mailpit:
  #   image: axllent/mailpit:latest
  #   container_name: agendauno-mailpit
  #   ports:
  #     - "1025:1025"   # SMTP
  #     - "8025:8025"   # Web UI
  #   restart: unless-stopped

  # Optional: run MySQL in Docker instead of WAMP. Uses 3307 to avoid clashing
  # with WAMP's 3306. If you enable this, update apps/api/.env DB_PORT=3307.
  # mysql:
  #   image: mysql:8.4
  #   container_name: agendauno-mysql
  #   environment:
  #     MYSQL_ROOT_PASSWORD: root
  #     MYSQL_DATABASE: agendauno
  #   ports:
  #     - "3307:3306"
  #   volumes:
  #     - mysql-data:/var/lib/mysql
  #   restart: unless-stopped

volumes:
  redis-data:
  # mysql-data:
